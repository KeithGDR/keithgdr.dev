# nginx site config for keithgdr.dev.
# Installed to /etc/nginx/sites-available/keithgdr.dev (or conf.d/keithgdr.dev.conf) by setup.sh.
# Certbot adds the HTTPS server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name keithgdr.dev www.keithgdr.dev;

    root /var/www/keithgdr.dev;
    index index.html;

    # Send www to the bare domain.
    if ($host = www.keithgdr.dev) {
        return 301 https://keithgdr.dev$request_uri;
    }

    # Don't expose the git repo, server config or docs.
    location ~ /\.            { return 404; }
    location ^~ /deploy/      { return 404; }
    location ~ \.md$          { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages: always revalidate so changes show up right away.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Assets: cache for a week.
    location ~* \.(css|js|png|jpg|webp|svg|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
